# Path → jobs (dorny/paths-filter). Workflow-level paths-ignore skips this
# file entirely when every changed path is planning/docs (see `on:` below).
#
# | Paths                                              | Changes | Rust | Web | Deploy (push master/main) |
# |----------------------------------------------------|---------|------|-----|---------------------------|
# | todos/**, docs/**, root *.md, ISSUE_TEMPLATE       | —       | —    | —   | —                         |
# | crates/**, Cargo.*, clippy.toml, .cargo/**         | yes     | yes  | —   | —                         |
# | apps/web/** (includes FAQ markdown the Vite build) | yes     | —    | yes | yes                       |
# | scripts/**, this workflow                          | yes     | yes  | yes | yes (via Web)             |
#
# Root *.md is README.md / AGENTS.md only (`*` does not cross `/`).
# FAQ articles live under apps/web/src/lib/i18n/translations/faq/ and still run Web.

name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "todos/**"
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "todos/**"
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - '.cargo/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo llvm-cov --workspace --exclude cs2analyzer-wasm --html --output-dir target/coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-coverage
          path: target/coverage
          retention-days: 14

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: prettier
        run: npm run format:check
      - name: eslint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 14
      - name: build
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: web-dist
          path: apps/web/dist

  deploy:
    name: Deploy to OVH
    runs-on: ubuntu-latest
    needs: [rust, web]
    # Web-only master pushes skip Rust; still publish. Rust-only skips deploy
    # (no new web-dist). A failed Rust job on a mixed change still blocks.
    if: >
      !cancelled() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      needs.web.result == 'success' &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - name: Publish via FTP (upload then swap)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          ./scripts/ftp-publish.sh dist
