# Called by Real demos. No push or schedule trigger: this file never starts a
# run of its own.
#
# ubuntu-24.04 does not pin a CPU. AMD EPYC 7763 (Zen 3, two physical cores)
# parses the release demos in about 13 minutes. EPYC 9V45 and Xeon 6973P
# finish the same commit in about 7 minutes, with the same cargo and demo
# cache hits. Decline 7763 unless the caller sets allow-slow, which is the
# last attempt: a pool of only that SKU must still parse and still refresh
# the demo cache.

name: Real demos parse

on:
  workflow_call:
    inputs:
      allow-slow:
        description: Parse on AMD EPYC 7763 instead of declining it.
        type: boolean
        required: true
      save-cache:
        description: Save the demo cache after a miss. Callers pass false for pull requests.
        type: boolean
        required: true
    outputs:
      accepted:
        description: The string true when this runner started the parse, false when it declined EPYC 7763.
        value: ${{ jobs.parse.outputs.accepted }}
      model:
        description: lscpu model name, possibly empty.
        value: ${{ jobs.parse.outputs.model }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  parse:
    name: Parse
    runs-on: ubuntu-24.04
    # A finished EPYC 7763 pass is ~13m (runs 39753456350 and 40302084358).
    # 45m still covers a cold release build and a ~3 GB demo download.
    # The previous 180m cap let a hung parse occupy a runner for three hours.
    timeout-minutes: 45
    outputs:
      accepted: ${{ steps.cpu.outputs.accepted }}
      model: ${{ steps.cpu.outputs.model }}
    steps:
      - uses: actions/checkout@v6
      - name: Runner CPU
        id: cpu
        run: |
          set -euo pipefail
          allow_slow="${{ inputs.allow-slow }}"
          case "$allow_slow" in
            true | false) ;;
            *)
              echo "unexpected allow-slow value: ${allow_slow}"
              exit 1
              ;;
          esac
          cpu="$(lscpu)"
          printf '%s\n' "$cpu"
          model="$(awk '/^Model name:/ { sub(/^Model name:[[:space:]]*/, ""); sub(/[[:space:]]+$/, ""); print; exit }' <<< "$cpu")"
          if [[ -z "$model" ]]; then
            accepted=true
            echo "lscpu did not report a model name; parsing on this runner."
          elif [[ "$allow_slow" != "true" && "$model" == *"EPYC 7763"* ]]; then
            accepted=false
            echo "Declining ${model}. This Zen 3 SKU parses the release demos about twice as slowly as EPYC 9V45 or Xeon 6973P on the same commit with the same cache hits. A later attempt gets a new runner."
          else
            accepted=true
            if [[ "$model" == *"EPYC 7763"* ]]; then
              echo "Parsing on ${model} because this is the last attempt."
            else
              echo "Parsing on ${model}."
            fi
          fi
          {
            echo "model<<EOF"
            echo "$model"
            echo "EOF"
            echo "accepted=${accepted}"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "- CPU: \`${model}\`"
              echo "- accepted: ${accepted}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cpu.outputs.accepted == 'true'
      # shared-key keeps the historical key real-demos-real-demos-Linux-x64-
      # The default key includes the job id (`parse` here), which would miss
      # the cache saved by the old `real-demos` job.
      - uses: Swatinem/rust-cache@v2
        if: steps.cpu.outputs.accepted == 'true'
        with:
          prefix-key: real-demos
          shared-key: real-demos
      # Exact manifest hash only. No restore-keys, so an older demo set is never restored.
      # Pull requests only restore. A PR-scoped save of this ~2.9 GB dir evicts
      # the master entry from GitHub's 10 GB cache limit.
      - uses: actions/cache/restore@v4
        id: demos
        if: steps.cpu.outputs.accepted == 'true'
        with:
          path: test-demos/files
          key: test-demos-${{ hashFiles('test-demos/manifest.json') }}
      - name: Verify sha256 or download demos
        if: steps.cpu.outputs.accepted == 'true'
        run: |
          set -euo pipefail
          if [[ "${{ steps.demos.outputs.cache-hit }}" == "true" ]]; then
            echo "demo cache hit; hashing every file and re-downloading any mismatch"
          else
            echo "demo cache miss; downloading"
          fi
          ./scripts/run.sh --fetch-demos
      - uses: actions/cache/save@v4
        if: steps.cpu.outputs.accepted == 'true' && inputs.save-cache && steps.demos.outputs.cache-hit != 'true'
        with:
          path: test-demos/files
          key: test-demos-${{ hashFiles('test-demos/manifest.json') }}
      # --nocapture prints each demo's release parse_ms. One test thread keeps
      # the per-demo RSS sample from overlapping another parse. Cargo's
      # --no-fail-fast (before `--`) still runs the later targets after one
      # fails. The test harness has no such flag. time -v is informational;
      # the harness still fails the step when a test fails.
      - name: Ignored tests (release)
        if: steps.cpu.outputs.accepted == 'true'
        run: |
          set -euo pipefail
          if [[ ! -x /usr/bin/time ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq time
          fi
          /usr/bin/time -v cargo test --release --no-fail-fast -p cs2analyzer -- --ignored --nocapture --test-threads=1
