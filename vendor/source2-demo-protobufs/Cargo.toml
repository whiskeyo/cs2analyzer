[package]
name = "source2-demo-protobufs"
version = "0.5.9"
edition = "2021"
rust-version = "1.79"
authors = ["Artem Rupasov <artemrupasov125@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Dota 2, Deadlock, and CS2 Protobufs"
repository = "https://github.com/Rupas1k/source2-demo"
