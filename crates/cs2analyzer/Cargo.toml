[package]
name = "cs2analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parse Counter-Strike 2 demo files into compact replay snapshots and per-player stats."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
source2-demo = { workspace = true }

[dev-dependencies]
sha2 = "0.10"
source2-demo = { workspace = true }
# Constrain resolution without linking into the parser. Remove with the pin.
source2-demo-macros = { workspace = true }
source2-demo-protobufs = { workspace = true }

[features]
default = ["mimalloc", "match-stats", "test-hooks"]
mimalloc = ["source2-demo/mimalloc"]
match-stats = []
# Integration tests are not `cfg(test)` for this library. On by default so
# `cargo test -p cs2analyzer` can attach a read-only observer to the same parse.
# WASM depends with `default-features = false`. The CLI lists `mimalloc` and
# `match-stats` only. The hook does not change `Match` output.
test-hooks = []

[lints]
workspace = true
