[package]
name = "cs2analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parse Counter-Strike 2 demo files into compact replay snapshots and per-player stats."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
source2-demo = { workspace = true }

[dev-dependencies]
sha2 = "0.10"
source2-demo = { workspace = true }
# Constrain resolution without linking into the parser. Remove with the pin.
source2-demo-macros = { workspace = true }
source2-demo-protobufs = { workspace = true }
# Enables `test-hooks` for this package's tests only. Downstream crates do not
# see a dev-dependency, and the feature is not in `default`.
cs2analyzer = { path = ".", features = ["test-hooks"] }

[features]
default = ["mimalloc", "match-stats"]
mimalloc = ["source2-demo/mimalloc"]
match-stats = []
# Integration tests are not `cfg(test)` for this library. Not a default
# feature: WASM and the CLI must not compile it in. Tests enable it via the
# dev-dependency above.
test-hooks = []

[lints]
workspace = true
