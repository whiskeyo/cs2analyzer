[package]
name = "cs2analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parse Counter-Strike 2 demo files into compact replay snapshots and per-player stats."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
source2-demo = { workspace = true }
# Only here to keep the source2-demo stack on 0.5.8. Remove together with the source2-demo pin.
source2-demo-macros = { workspace = true }
source2-demo-protobufs = { workspace = true }

[features]
default = ["mimalloc", "match-stats"]
mimalloc = ["source2-demo/mimalloc"]
match-stats = []

[lints]
workspace = true
