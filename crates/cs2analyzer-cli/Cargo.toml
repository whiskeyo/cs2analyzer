[package]
name = "cs2analyzer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for parsing CS2 demo files with cs2analyzer."

[[bin]]
name = "cs2analyzer"
path = "src/main.rs"

[dependencies]
cs2analyzer = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
