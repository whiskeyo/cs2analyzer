[workspace]
resolver = "2"
members = [
    "crates/cs2analyzer",
    "crates/cs2analyzer-cli",
    "crates/cs2analyzer-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/whiskeyo/cs2analyzer"

[workspace.dependencies]
cs2analyzer = { path = "crates/cs2analyzer", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
source2-demo = { version = "0.5", default-features = false, features = ["cs2"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
