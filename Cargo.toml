[workspace]
resolver = "2"
members = [
    "crates/cs2analyzer",
    "crates/cs2analyzer-cli",
    "crates/cs2analyzer-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/whiskeyo/cs2analyzer"

[workspace.dependencies]
cs2analyzer = { path = "crates/cs2analyzer", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pinned: 0.5.9 changes view-angle decoding. Lift with a real-demo angle test.
source2-demo = { version = "=0.5.8", default-features = false, features = ["cs2"] }
# Only here to keep the source2-demo stack on 0.5.8. Remove together with the source2-demo pin.
source2-demo-macros = "=0.5.8"
source2-demo-protobufs = "=0.5.8"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

