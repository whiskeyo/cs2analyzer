[workspace]
resolver = "2"
members = [
    "crates/cs2analyzer",
    "crates/cs2analyzer-cli",
    "crates/cs2analyzer-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/whiskeyo/cs2analyzer"

[workspace.dependencies]
cs2analyzer = { path = "crates/cs2analyzer", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Temporary git pin: whiskeyo/source2-demo@c28c63e (lossy game-event val_string).
# Was crates.io =0.5.9 after the assets-v1 comparison — switch back (or to a
# released version) once that fix is on crates.io. Keep the three in lockstep.
source2-demo = { git = "https://github.com/whiskeyo/source2-demo", rev = "c28c63ebded6e97ca7005178162cf954e7e6a6b2", default-features = false, features = ["cs2"] }
source2-demo-macros = { git = "https://github.com/whiskeyo/source2-demo", rev = "c28c63ebded6e97ca7005178162cf954e7e6a6b2" }
source2-demo-protobufs = { git = "https://github.com/whiskeyo/source2-demo", rev = "c28c63ebded6e97ca7005178162cf954e7e6a6b2" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

