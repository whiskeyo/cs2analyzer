[workspace]
resolver = "2"
members = [
    "crates/cs2analyzer",
    "crates/cs2analyzer-cli",
    "crates/cs2analyzer-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/whiskeyo/cs2analyzer"

[workspace.dependencies]
cs2analyzer = { path = "crates/cs2analyzer", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Exact pin. source2-demo depends on the macros and protobuf crates as
# ^0.5.x, so those are pinned too. Remove the three pins together.
source2-demo = { version = "=0.5.10", default-features = false, features = ["cs2"] }
source2-demo-macros = "=0.5.10"
source2-demo-protobufs = "=0.5.10"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

