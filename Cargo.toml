[workspace]
resolver = "2"
members = [
    "crates/cs2analyzer",
    "crates/cs2analyzer-cli",
    "crates/cs2analyzer-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/whiskeyo/cs2analyzer"

[workspace.dependencies]
cs2analyzer = { path = "crates/cs2analyzer", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# crates.io =0.5.9 pins (assets-v1). Patched to whiskeyo/source2-demo@c28c63e
# (lossy game-event val_string) via vendor/ until that fix is released.
source2-demo = { version = "=0.5.9", default-features = false, features = ["cs2"] }
source2-demo-macros = "=0.5.9"
source2-demo-protobufs = "=0.5.9"

[patch.crates-io]
source2-demo = { path = "vendor/source2-demo" }
source2-demo-protobufs = { path = "vendor/source2-demo-protobufs" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

